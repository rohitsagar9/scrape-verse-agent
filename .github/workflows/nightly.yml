name: Autonomous CI Scraper — Nightly Pipeline

on:
  schedule:
    # Every night at 03:00 UTC
    - cron: "0 3 * * *"
  # Manual trigger for demos and testing — no waiting for 3am
  workflow_dispatch:
    inputs:
      force_heal:
        description: "Force a heal cycle even if no hash change detected (for demo)"
        required: false
        default: "false"
        type: boolean
      target_url:
        description: "Override target URL"
        required: false
        default: ""

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  TARGET_URL: ${{ github.event.inputs.target_url || 'https://news.ycombinator.com' }}

jobs:
  nightly-scrape:
    name: Nightly Scrape & Self-Heal
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      # ── 1. Setup ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for idempotency checks

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            requests \
            beautifulsoup4 \
            lxml

      - name: Verify bdata CLI is accessible
        run: |
          npx -p @brightdata/cli bdata --version || echo "bdata CLI loaded via npx"
        env:
          BRIGHT_DATA_API_TOKEN: ${{ secrets.BRIGHT_DATA_API_TOKEN }}

      # ── 2. Fingerprint — fetch + normalize + hash ────────────────────────────
      - name: Fetch target page
        id: fetch
        run: |
          python fingerprint/fetch_block.py > /tmp/fetch_meta.json
          echo "html_length=$(jq -r .html_length /tmp/fetch_meta.json)" >> $GITHUB_OUTPUT
        env:
          TARGET_URL: ${{ env.TARGET_URL }}
          BRIGHT_DATA_API_TOKEN: ${{ secrets.BRIGHT_DATA_API_TOKEN }}

      - name: Compute DOM fingerprint hash
        id: fingerprint
        run: |
          set +e
          python fingerprint/hash_block.py > /tmp/hash_report.json
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          cat /tmp/hash_report.json
          if [ "$EXIT_CODE" = "0" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          elif [ "$EXIT_CODE" = "1" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            # Exit 2 = first run, baseline just written
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "first_run=true" >> $GITHUB_OUTPUT
          fi
        env:
          TARGET_URL: ${{ env.TARGET_URL }}

      # ── 3a. Happy path — hash matched ───────────────────────────────────────
      - name: Run scraper (happy path)
        id: scraper_run
        if: steps.fingerprint.outputs.changed == 'false' && steps.fingerprint.outputs.first_run != 'true' && github.event.inputs.force_heal != 'true'
        run: |
          COLLECTOR_ID=$(jq -r .collector_id scraper/collector.json)
          npx -p @brightdata/cli bdata scraper run "$COLLECTOR_ID" "$TARGET_URL" \
            > /tmp/scraper_output.json
          echo "collector_id=$COLLECTOR_ID" >> $GITHUB_OUTPUT
        env:
          TARGET_URL: ${{ env.TARGET_URL }}
          BRIGHT_DATA_API_TOKEN: ${{ secrets.BRIGHT_DATA_API_TOKEN }}
          COLLECTOR_ID: ${{ secrets.COLLECTOR_ID }}

      - name: Validate scraper output
        id: validate_happy
        if: steps.scraper_run.outcome == 'success'
        run: |
          python validate/schema_check.py /tmp/scraper_output.json > /tmp/validation_result.json
          PASSED=$(jq -r .passed /tmp/validation_result.json)
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          cat /tmp/validation_result.json

      - name: Save extraction snapshot
        if: steps.validate_happy.outputs.passed == 'true'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          mkdir -p data logs
          cp /tmp/scraper_output.json "data/$TODAY.json"
          
          # Append to run history (idempotent — skip if today already present)
          python - <<'EOF'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          path = Path("logs/run_history.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          history = json.loads(path.read_text()) if path.exists() else []

          if any(e.get("date") == today for e in history):
              print(f"[log] Entry for {today} already exists — skipping.")
          else:
              history.append({
                  "date": today,
                  "signal": "none",
                  "outcome": "ok",
                  "timestamp": datetime.now(timezone.utc).isoformat(),
              })
              path.write_text(json.dumps(history, indent=2))
              print(f"[log] Appended run entry for {today}")
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/$TODAY.json" logs/run_history.json
          git diff --staged --quiet || git commit -m "chore: nightly data snapshot $TODAY"
          git push

      # ── 3b. Mismatch / forced-heal path ─────────────────────────────────────
      - name: Re-check fingerprint (anti-noise double-check)
        id: recheck
        if: steps.fingerprint.outputs.changed == 'true' || github.event.inputs.force_heal == 'true'
        run: |
          # Wait 90 seconds and re-fetch to rule out transient render glitch
          echo "Waiting 90s before re-check..."
          sleep 90
          python fingerprint/fetch_block.py > /dev/null
          set +e
          python fingerprint/hash_block.py > /tmp/recheck_report.json
          EXIT=$?
          if [ "$EXIT" = "1" ]; then
            echo "still_changed=true" >> $GITHUB_OUTPUT
          else
            echo "still_changed=false" >> $GITHUB_OUTPUT
          fi
          cat /tmp/recheck_report.json
        env:
          TARGET_URL: ${{ env.TARGET_URL }}
          BRIGHT_DATA_API_TOKEN: ${{ secrets.BRIGHT_DATA_API_TOKEN }}

      - name: Build incident package
        id: build_incident
        if: steps.recheck.outputs.still_changed == 'true' || github.event.inputs.force_heal == 'true'
        run: |
          python heal/build_incident.py /tmp/recheck_report.json
          echo "incident_built=true" >> $GITHUB_OUTPUT
        env:
          COLLECTOR_ID: ${{ secrets.COLLECTOR_ID }}
          TARGET_URL: ${{ env.TARGET_URL }}

      - name: Run cascading heal agent
        id: heal
        if: steps.build_incident.outputs.incident_built == 'true'
        run: |
          python heal/heal_agent.py > /tmp/heal_result.json
          EXIT=$?
          OUTCOME=$(jq -r .outcome /tmp/heal_result.json)
          STAGE=$(jq -r .stage_used /tmp/heal_result.json)
          echo "outcome=$OUTCOME" >> $GITHUB_OUTPUT
          echo "stage_used=$STAGE" >> $GITHUB_OUTPUT
          cat /tmp/heal_result.json
          exit $EXIT
        continue-on-error: true
        env:
          BRIGHT_DATA_API_TOKEN: ${{ secrets.BRIGHT_DATA_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COLLECTOR_ID: ${{ secrets.COLLECTOR_ID }}
          TARGET_URL: ${{ env.TARGET_URL }}

      # ── 4. Append heal run to history ────────────────────────────────────────
      - name: Update run history (heal path)
        if: steps.build_incident.outputs.incident_built == 'true'
        run: |
          python - <<'EOF'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          path = Path("logs/run_history.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          history = json.loads(path.read_text()) if path.exists() else []

          if any(e.get("date") == today for e in history):
              print(f"[log] Entry for {today} already exists — skipping.")
          else:
              outcome = os.environ.get("HEAL_OUTCOME", "unknown")
              stage = os.environ.get("HEAL_STAGE", "unknown")
              
              # Determine signal
              try:
                  report = json.loads(Path("/tmp/recheck_report.json").read_text())
                  block_changed = report.get("block_changed", False)
                  fields_changed = len(report.get("changed_fields", [])) > 0
                  if block_changed and fields_changed:
                      signal = "both"
                  elif block_changed:
                      signal = "hash"
                  else:
                      signal = "data"
              except Exception:
                  signal = "unknown"

              history.append({
                  "date": today,
                  "signal": signal,
                  "outcome": outcome,
                  "stage_used": stage,
                  "timestamp": datetime.now(timezone.utc).isoformat(),
              })
              path.write_text(json.dumps(history, indent=2))
              print(f"[log] Appended heal entry for {today}: signal={signal} outcome={outcome}")
          EOF
        env:
          HEAL_OUTCOME: ${{ steps.heal.outputs.outcome }}
          HEAL_STAGE: ${{ steps.heal.outputs.stage_used }}

      # ── 5. Commit to self-heal branch + open PR ──────────────────────────────
      - name: Commit heal artifacts to branch
        if: steps.build_incident.outputs.incident_built == 'true'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          BRANCH="self-heal/$TODAY"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if branch already exists (idempotency)
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "Branch $BRANCH already exists — skipping commit."
            echo "branch_name=$BRANCH" >> $GITHUB_ENV
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add -A
          git diff --staged --quiet || git commit -m "self-heal: incident $TODAY — ${{ steps.heal.outputs.outcome }} via ${{ steps.heal.outputs.stage_used }}"
          git push origin "$BRANCH"
          echo "branch_name=$BRANCH" >> $GITHUB_ENV

      - name: Open pull request
        if: steps.build_incident.outputs.incident_built == 'true' && env.branch_name != ''
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;
            const branch = process.env.branch_name;
            const today = new Date().toISOString().slice(0, 10);
            const outcome = '${{ steps.heal.outputs.outcome }}';
            const stage = '${{ steps.heal.outputs.stage_used }}';

            // Check if PR already exists
            const prs = await github.rest.pulls.list({
              owner, repo,
              head: `${owner}:${branch}`,
              state: 'open',
            });
            if (prs.data.length > 0) {
              console.log('PR already exists — skipping.');
              return;
            }

            const emoji = outcome === 'healed' ? '✅' : outcome === 'escalated' ? '🚨' : '⚠️';
            await github.rest.pulls.create({
              owner, repo,
              title: `${emoji} Self-Heal Incident ${today} — ${outcome} via ${stage}`,
              head: branch,
              base: 'main',
              body: `## Self-Heal Incident Report\n\n` +
                    `**Date:** ${today}\n` +
                    `**Outcome:** ${outcome}\n` +
                    `**Stage used:** ${stage}\n` +
                    `**Triggered by:** ${{ steps.heal.outputs.outcome }}\n\n` +
                    `### What happened\n` +
                    `The nightly fingerprint detected a structural change in the target page. ` +
                    `The cascading heal pipeline attempted recovery.\n\n` +
                    `### Files changed\n` +
                    `- \`fingerprint/baseline.json\` — updated DOM hash baseline\n` +
                    `- \`logs/run_history.json\` — run log appended\n` +
                    `- \`heal/playbook.json\` — playbook updated (if healed)\n\n` +
                    `> **Review:** Check that the new baseline and collector still produce valid output before merging.`,
            });

      # ── 6. Notify ─────────────────────────────────────────────────────────────
      - name: Send notification
        if: always()
        run: |
          python - <<'EOF'
          import json, os, sys
          import urllib.request

          slack_url = os.environ.get("SLACK_WEBHOOK_URL", "")
          discord_url = os.environ.get("DISCORD_WEBHOOK_URL", "")
          
          outcome = os.environ.get("HEAL_OUTCOME", "ok")
          stage = os.environ.get("HEAL_STAGE", "n/a")
          run_url = f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
          
          if outcome == "healed":
              emoji = "✅"
              color = "#3FB8AF"
          elif outcome == "escalated":
              emoji = "🚨"
              color = "#E85D4E"
          else:
              emoji = "📊"
              color = "#E8A33D"
          
          message = f"{emoji} Autonomous CI Scraper nightly run\nOutcome: {outcome} | Stage: {stage}\n{run_url}"
          
          if slack_url:
              payload = json.dumps({"text": message}).encode()
              req = urllib.request.Request(slack_url, data=payload, headers={"Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req, timeout=10)
                  print("Slack notification sent.")
              except Exception as e:
                  print(f"Slack notification failed: {e}", file=sys.stderr)
          
          if discord_url:
              payload = json.dumps({"content": message}).encode()
              req = urllib.request.Request(discord_url, data=payload, headers={"Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req, timeout=10)
                  print("Discord notification sent.")
              except Exception as e:
                  print(f"Discord notification failed: {e}", file=sys.stderr)
          
          if not slack_url and not discord_url:
              print("No notification webhook configured — skipping.")
          EOF
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEAL_OUTCOME: ${{ steps.heal.outputs.outcome }}
          HEAL_STAGE: ${{ steps.heal.outputs.stage_used }}
